name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [device-agent, gateway, backend-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  management-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: gradle test and build
        working-directory: management-api
        run: ./gradlew test build --no-daemon

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose config
        run: docker compose -f infra/compose.yaml --env-file .env.example config

  compose-smoke:
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: docker compose -f infra/compose.yaml --env-file .env.example build
      - name: start stack
        run: docker compose -f infra/compose.yaml --env-file .env.example up -d
      - name: wait for all services to report healthy
        run: |
          set -euo pipefail
          timeout=180
          elapsed=0
          until [ "$elapsed" -ge "$timeout" ]; do
            unhealthy="$(docker compose -f infra/compose.yaml --env-file .env.example ps --format json \
              | jq -s -r '.[] | select(.Health != null and .Health != "" and .Health != "healthy") | .Name')"
            if [ -z "$unhealthy" ]; then
              echo "All services are healthy."
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Timed out waiting for services to become healthy:"
          docker compose -f infra/compose.yaml --env-file .env.example ps
          exit 1
      - name: dump logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file .env.example logs
      - name: tear down stack
        if: always()
        run: docker compose -f infra/compose.yaml --env-file .env.example down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: reject tracked key and certificate files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(key|pem|p12|pfx|jks|csr|crt)$'; then
            echo "Key or certificate files must not be committed."
            exit 1
          fi
      - name: reject tracked .env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file must not be committed; only .env.example is tracked."
            exit 1
          fi
      - name: reject embedded private key material
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':(exclude)*.md'; then
            echo "Private key material must not be committed."
            exit 1
          fi
