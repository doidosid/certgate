name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [device-agent, gateway, backend-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      # -race needs cgo, and cgo needs a C compiler. ubuntu-latest ships one,
      # so CGO_ENABLED is 1 here and no extra install step is needed. On a
      # Windows dev machine with no C compiler the Go toolchain falls back to
      # CGO_ENABLED=0 and -race cannot run at all, which is why this check
      # belongs in CI rather than in a developer's local routine: the Gateway
      # runs its Outbox Sender, Access Cache, and mTLS Handler as concurrent
      # goroutines over shared state. Note this detects races only on paths the
      # tests actually execute concurrently.
      - name: go test (race detector)
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  management-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: gradle test and build
        working-directory: management-api
        run: ./gradlew test build --no-daemon

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose config
        run: docker compose -f infra/compose.yaml --env-file .env.example config

  pki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PKI Script에는 runnable check가 있는데 지금까지 CI에서 실행되지 않았다.
      # 각 Script는 매 실행마다 임시 디렉터리에 새 PKI를 만들고 검증 후 지운다
      # (pki/README.md "Test는 매 실행마다 임시 PKI를 생성").
      - name: init-ca.sh
        run: ./pki/scripts/test_init_ca.sh
      - name: issue-gateway-cert.sh
        run: ./pki/scripts/test_issue_gateway_cert.sh

  compose-smoke:
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      # 실행 이미지에는 인증서를 굽지 않고 Job 실행 중에 임시 PKI를 만들어 bind
      # mount로 주입한다(docs/operations.md "CI 준비": "E2E 임시 Key는 Job 실행
      # 중 생성하고 Artifact로 업로드하지 않음"). 이 Step이 없으면 compose가
      # 없는 bind mount 원본을 디렉터리로 만들어 컨테이너가 깨진다.
      - name: generate temporary PKI
        run: |
          set -euo pipefail
          ./pki/scripts/init-ca.sh
          ./pki/scripts/issue-gateway-cert.sh
      - name: build images
        run: docker compose -f infra/compose.yaml --env-file .env.example build
      - name: start stack
        run: docker compose -f infra/compose.yaml --env-file .env.example up -d
      # 기대하는 서비스 이름을 명시하고 그 전부가 healthy가 되기를 기다린다.
      # 이전 판은 "unhealthy가 없으면 통과"였는데, docker compose ps는 -a 없이는
      # 실행 중인 컨테이너만 나열하므로 기동에 실패해 종료된 서비스가 목록에서
      # 아예 빠지고 그대로 통과했다. Gateway가 한 번도 뜨지 못하는 상태를 CI가
      # 초록불로 덮고 있었다(Issue #34).
      - name: wait for every expected service to report healthy
        run: |
          set -euo pipefail
          expected="admin-console backend-service gateway management-api postgres"
          compose="docker compose -f infra/compose.yaml --env-file .env.example"
          timeout=180
          elapsed=0
          while [ "$elapsed" -lt "$timeout" ]; do
            healthy="$($compose ps --format json | jq -s -r '.[] | select(.Health == "healthy") | .Service')"
            missing=""
            for service in $expected; do
              echo "$healthy" | grep -qx "$service" || missing="$missing $service"
            done
            if [ -z "$missing" ]; then
              echo "All expected services are healthy: $expected"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Timed out. Services still not healthy:$missing"
          echo "--- docker compose ps -a (종료된 컨테이너 포함) ---"
          $compose ps -a
          exit 1
      # Console origin에서 /api proxy를 실제로 타는지 검증한다. 앞의 healthcheck는
      # 각 컨테이너가 살아 있는지만 보고 이 경로를 한 번도 지나가지 않으므로, nginx
      # 설정 오타나 향후 proxy_pass 변경으로 생기는 CORS·SSE 회귀를 잡지 못한다
      # (Codex 리뷰 PR #33 Medium).
      - name: verify console /api proxy contract
        run: |
          set -euo pipefail
          set -a; . ./.env.example; set +a
          console="http://127.0.0.1:${ADMIN_CONSOLE_PORT}"

          echo "1) REST 경로가 Management API에 도달하는지"
          curl -fsS "$console/api/v1/devices" | jq -e 'has("content") and .page == 0' > /dev/null

          echo "2) SPA fallback이 /api 를 가로채지 않는지"
          curl -fsS -o /dev/null "$console/devices"

          echo "3) X-Trace-Id가 왕복에서 보존되는지 (docs/api-spec.md §1)"
          sent="proxy-smoke-trace-id"
          received="$(curl -fsS -D - -o /dev/null -H "X-Trace-Id: $sent" "$console/api/v1/devices" \
            | tr -d '\r' | awk 'tolower($1) == "x-trace-id:" { print $2 }')"
          if [ "$received" != "$sent" ]; then
            echo "X-Trace-Id = '$received', want '$sent'"
            exit 1
          fi

          echo "4) SSE가 버퍼링 없이 즉시 열리는지"
          # proxy_buffering이 켜져 있으면 connected 주석 프레임이 즉시 나오지 않아
          # 이 짧은 max-time 안에 아무것도 받지 못한다. curl은 stream을 끊을 때
          # 28로 끝나므로 종료 코드는 무시하고 받은 내용만 본다.
          stream="$(curl -sN --max-time 5 "$console/api/v1/security-events/stream" || true)"
          if ! printf '%s' "$stream" | grep -q "connected"; then
            echo "SSE stream did not deliver the connected frame within 5s:"
            printf '%s\n' "$stream"
            exit 1
          fi
      # Gateway가 실제로 mTLS를 강제하는지 확인한다. Issue #34 이전에는 Gateway가
      # Compose에서 아예 뜨지 못했으므로 이 경로는 CI에서 검증된 적이 없다.
      - name: verify gateway enforces mTLS
        run: |
          set -euo pipefail
          set -a; . ./.env.example; set +a
          gateway="https://127.0.0.1:${GATEWAY_MTLS_PORT}"

          echo "1) Gateway 서버 인증서가 우리 CA chain으로 검증되는지"
          subject="$(echo | openssl s_client -connect "127.0.0.1:${GATEWAY_MTLS_PORT}" \
            -CAfile pki/runtime/ca-chain.crt -verify_return_error 2>/dev/null | openssl x509 -noout -subject)"
          echo "   $subject"

          echo "2) Client 인증서 없는 접속이 차단되는지 (Fail Closed)"
          # docs/security-design.md §5: Client Certificate는 항상 필수다. 성공하면
          # mTLS가 강제되지 않는다는 뜻이므로 실패해야 정상이다.
          if curl -fsS --cacert pki/runtime/ca-chain.crt --max-time 10 "$gateway/telemetry" -o /dev/null 2>/dev/null; then
            echo "   FAIL: Gateway accepted a request without a client certificate"
            exit 1
          fi
          echo "   OK: 인증서 없는 접속이 거부됐다"

          echo "3) Root CA Key가 어느 컨테이너에도 없는지 (docs/security-design.md §3)"
          compose="docker compose -f infra/compose.yaml --env-file .env.example"
          for service in gateway management-api; do
            if $compose exec -T "$service" sh -c 'test -e /run/certgate/root-ca.key'; then
              echo "   FAIL: $service 컨테이너에 root-ca.key가 들어 있다"
              exit 1
            fi
            echo "   OK: $service 에 root-ca.key 없음"
          done
      - name: dump logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file .env.example logs
      - name: tear down stack
        if: always()
        run: docker compose -f infra/compose.yaml --env-file .env.example down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: reject tracked key and certificate files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(key|pem|p12|pfx|jks|csr|crt)$'; then
            echo "Key or certificate files must not be committed."
            exit 1
          fi
      - name: reject tracked .env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file must not be committed; only .env.example is tracked."
            exit 1
          fi
      - name: reject embedded private key material
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':(exclude)*.md'; then
            echo "Private key material must not be committed."
            exit 1
          fi
