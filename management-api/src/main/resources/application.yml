server:
  port: ${MANAGEMENT_API_PORT:8080}

spring:
  application:
    name: management-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

certgate:
  ca:
    # Left unset in environments (e.g. Foundation health tests) that never
    # sign a certificate; IntermediateCertificateAuthority loads these lazily
    # and only fails, with CA_SIGNING_FAILED, when a signing request arrives.
    root-cert-path: ${ROOT_CA_CERT_PATH:}
    intermediate-cert-path: ${INTERMEDIATE_CA_CERT_PATH:}
    intermediate-key-path: ${INTERMEDIATE_CA_KEY_PATH:}
  enrollment:
    token-ttl-hours: ${ENROLLMENT_TOKEN_TTL_HOURS:24}
  certificate:
    validity-days: ${DEVICE_CERTIFICATE_VALIDITY_DAYS:30}
  gateway:
    # Left unset in environments (e.g. Foundation health tests) that never
    # call a /internal/** endpoint; GatewayServiceTokenFilter then rejects
    # every such request instead of accepting an empty token.
    service-token: ${GATEWAY_SERVICE_TOKEN:}
    # Left unset in environments that never revoke a Certificate;
    # GatewayCacheClient then logs and skips instead of failing revocation.
    internal-url: ${GATEWAY_INTERNAL_URL:}
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
