:root[data-theme=&quot;light&quot;] {

.btn:not(:disabled):hover {

  min-height: 28px;

  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#certgate-wireframe {
  color-scheme: light dark;
  --cg-bg: light-dark(#f3f6fa, #0f1724);
  --cg-surface: light-dark(#ffffff, #172131);
  --cg-surface-soft: light-dark(#f8fafc, #1d293a);
  --cg-text: light-dark(#172033, #e8eef7);
  --cg-muted: light-dark(#667085, #9ba9bc);
  --cg-line: light-dark(#dce3ec, #334155);
  --cg-brand: light-dark(#1f4e78, #73a9d6);
  --cg-brand-soft: light-dark(#e8f1f8, #20364b);
  --cg-danger: light-dark(#b42318, #ff8b82);
  --cg-danger-soft: light-dark(#fff0ee, #462421);
  --cg-warning: light-dark(#946200, #f1c75b);
  --cg-warning-soft: light-dark(#fff7df, #3b321c);
  --cg-success: light-dark(#16794b, #6bd5a2);
  --cg-success-soft: light-dark(#eaf8f1, #18392d);
  color: var(--cg-text);
  font-family: Inter, Pretendard, &quot;Noto Sans KR&quot;, system-ui, sans-serif;
}
#certgate-wireframe * { box-sizing: border-box; }
#certgate-wireframe button,
#certgate-wireframe input,
#certgate-wireframe select { font: inherit; }
#certgate-wireframe .cg-window {
  position: relative;
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  min-height: 720px;
  overflow: hidden;
  background: var(--cg-bg);
  border: 1px solid var(--cg-line);
  border-radius: 12px;
}
#certgate-wireframe .cg-sidebar {
  padding: 22px 14px;
  background: var(--cg-surface);
  border-right: 1px solid var(--cg-line);
}
#certgate-wireframe .cg-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px 22px;
  font-weight: 500;
  letter-spacing: -.02em;
}
#certgate-wireframe .cg-brand-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--cg-brand);
  color: var(--cg-surface);
}
#certgate-wireframe .cg-nav { display: grid; gap: 5px; }
#certgate-wireframe .cg-nav button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--cg-muted);
  text-align: left;
  cursor: pointer;
}
#certgate-wireframe .cg-nav button[aria-selected=&quot;true&quot;] {
  background: var(--cg-brand-soft);
  color: var(--cg-brand);
  font-weight: 500;
}
#certgate-wireframe .cg-main { min-width: 0; }
#certgate-wireframe .cg-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 70px;
  padding: 14px 24px;
  background: var(--cg-surface);
  border-bottom: 1px solid var(--cg-line);
}
#certgate-wireframe .cg-title { margin: 0; font-size: 1.05rem; font-weight: 500; }
#certgate-wireframe .cg-top-actions { display: flex; align-items: center; gap: 10px; }
#certgate-wireframe .cg-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--cg-success);
  font-size: .82rem;
}
#certgate-wireframe .cg-live-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
#certgate-wireframe .cg-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid var(--cg-line);
  border-radius: 7px;
  background: var(--cg-surface);
  color: var(--cg-text);
  cursor: pointer;
}
#certgate-wireframe .cg-button-primary { border-color: var(--cg-brand); background: var(--cg-brand); color: var(--cg-surface); }
#certgate-wireframe .cg-button-danger { border-color: var(--cg-danger); color: var(--cg-danger); }
#certgate-wireframe .cg-content { padding: 22px 24px 30px; }
#certgate-wireframe .cg-page[hidden] { display: none; }
#certgate-wireframe .cg-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
#certgate-wireframe .cg-stat,
#certgate-wireframe .cg-panel {
  background: var(--cg-surface);
  border: 1px solid var(--cg-line);
  border-radius: 9px;
}
#certgate-wireframe .cg-stat { padding: 15px; }
#certgate-wireframe .cg-stat-label { color: var(--cg-muted); font-size: .78rem; }
#certgate-wireframe .cg-stat-value { margin-top: 8px; font-size: 1.45rem; font-weight: 500; }
#certgate-wireframe .cg-stat-note { margin-top: 5px; color: var(--cg-muted); font-size: .75rem; }
#certgate-wireframe .cg-dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(250px, .85fr);
  gap: 14px;
}
#certgate-wireframe .cg-panel { min-width: 0; padding: 17px; }
#certgate-wireframe .cg-panel h3 { margin: 0 0 15px; font-size: .92rem; font-weight: 500; }
#certgate-wireframe .cg-chart {
  display: flex;
  align-items: end;
  gap: 11px;
  height: 175px;
  padding: 12px 5px 0;
  border-bottom: 1px solid var(--cg-line);
}
#certgate-wireframe .cg-chart-group { display: flex; align-items: end; justify-content: center; gap: 3px; flex: 1; height: 100%; }
#certgate-wireframe .cg-bar { width: 10px; min-height: 3px; border-radius: 3px 3px 0 0; background: var(--cg-brand); }
#certgate-wireframe .cg-bar-denied { background: var(--cg-danger); }
#certgate-wireframe .cg-axis { display: flex; justify-content: space-between; padding-top: 8px; color: var(--cg-muted); font-size: .72rem; }
#certgate-wireframe .cg-legend { display: flex; gap: 14px; margin-top: 12px; color: var(--cg-muted); font-size: .75rem; }
#certgate-wireframe .cg-legend span { display: inline-flex; align-items: center; gap: 6px; }
#certgate-wireframe .cg-swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--cg-brand); }
#certgate-wireframe .cg-swatch-danger { background: var(--cg-danger); }
#certgate-wireframe .cg-health { display: grid; gap: 13px; }
#certgate-wireframe .cg-health-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
#certgate-wireframe .cg-health-name { font-size: .84rem; }
#certgate-wireframe .cg-health-meta { color: var(--cg-muted); font-size: .72rem; }
#certgate-wireframe .cg-status { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; white-space: nowrap; }
#certgate-wireframe .cg-status::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
#certgate-wireframe .cg-ok { color: var(--cg-success); }
#certgate-wireframe .cg-warn { color: var(--cg-warning); }
#certgate-wireframe .cg-critical { color: var(--cg-danger); }
#certgate-wireframe .cg-events-panel { grid-column: 1 / -1; }
#certgate-wireframe .cg-event-list { display: grid; }
#certgate-wireframe .cg-event-item {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 11px 0;
  border-top: 1px solid var(--cg-line);
  font-size: .8rem;
}
#certgate-wireframe .cg-event-item:first-child { border-top: 0; }
#certgate-wireframe .cg-event-time { color: var(--cg-muted); }
#certgate-wireframe .cg-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}
#certgate-wireframe .cg-fields { display: flex; flex-wrap: wrap; gap: 8px; }
#certgate-wireframe .cg-input,
#certgate-wireframe .cg-select {
  min-height: 35px;
  padding: 7px 10px;
  border: 1px solid var(--cg-line);
  border-radius: 7px;
  background: var(--cg-surface);
  color: var(--cg-text);
}
#certgate-wireframe .cg-input { min-width: 210px; }
#certgate-wireframe .cg-table-shell {
  overflow-x: auto;
  background: var(--cg-surface);
  border: 1px solid var(--cg-line);
  border-radius: 9px;
}
#certgate-wireframe table { width: 100%; border-collapse: collapse; font-size: .78rem; }
#certgate-wireframe th,
#certgate-wireframe td { padding: 12px 13px; border-bottom: 1px solid var(--cg-line); text-align: left; vertical-align: middle; }
#certgate-wireframe tr:last-child td { border-bottom: 0; }
#certgate-wireframe th { background: var(--cg-surface-soft); color: var(--cg-muted); font-weight: 500; white-space: nowrap; }
#certgate-wireframe td { white-space: nowrap; }
#certgate-wireframe tbody tr { cursor: pointer; }
#certgate-wireframe tbody tr:hover { background: var(--cg-brand-soft); }
#certgate-wireframe .cg-chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--cg-surface-soft);
  color: var(--cg-muted);
  font-size: .72rem;
}
#certgate-wireframe .cg-chip-ok { background: var(--cg-success-soft); color: var(--cg-success); }
#certgate-wireframe .cg-chip-warn { background: var(--cg-warning-soft); color: var(--cg-warning); }
#certgate-wireframe .cg-chip-danger { background: var(--cg-danger-soft); color: var(--cg-danger); }
#certgate-wireframe .cg-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
#certgate-wireframe .cg-row-actions { display: flex; gap: 6px; }
#certgate-wireframe .cg-row-actions .cg-button { min-height: 29px; padding: 4px 8px; }
#certgate-wireframe .cg-toast {
  position: absolute;
  z-index: 5;
  top: 82px;
  right: 18px;
  width: min(360px, calc(100% - 36px));
  padding: 14px;
  border: 1px solid var(--cg-danger);
  border-radius: 10px;
  background: var(--cg-surface);
  box-shadow: 0 14px 34px light-dark(rgb(20 34 55 / .18), rgb(0 0 0 / .35));
}
#certgate-wireframe .cg-toast[hidden] { display: none; }
#certgate-wireframe .cg-toast-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#certgate-wireframe .cg-toast-title { display: flex; align-items: center; gap: 7px; color: var(--cg-danger); font-weight: 500; }
#certgate-wireframe .cg-toast-close { border: 0; background: transparent; color: var(--cg-muted); cursor: pointer; }
#certgate-wireframe .cg-toast-body { margin: 9px 0 4px; font-size: .82rem; }
#certgate-wireframe .cg-toast-meta { color: var(--cg-muted); font-size: .72rem; }
#certgate-wireframe .cg-toast-link { margin-top: 10px; border: 0; padding: 0; background: transparent; color: var(--cg-brand); cursor: pointer; }
#certgate-wireframe .cg-highlight { background: var(--cg-danger-soft) !important; }
@media (max-width: 860px) {
  #certgate-wireframe .cg-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #certgate-wireframe .cg-dashboard-grid { grid-template-columns: 1fr; }
  #certgate-wireframe .cg-events-panel { grid-column: auto; }
}
@media (max-width: 680px) {
  #certgate-wireframe .cg-window { display: block; min-height: 0; }
  #certgate-wireframe .cg-sidebar { padding: 12px; border-right: 0; border-bottom: 1px solid var(--cg-line); }
  #certgate-wireframe .cg-brand { padding: 0 4px 12px; }
  #certgate-wireframe .cg-nav { display: flex; overflow-x: auto; }
  #certgate-wireframe .cg-nav button { width: auto; flex: 0 0 auto; }
  #certgate-wireframe .cg-topbar { padding: 12px 15px; align-items: flex-start; }
  #certgate-wireframe .cg-top-actions { flex-direction: column; align-items: flex-end; }
  #certgate-wireframe .cg-content { padding: 15px; }
  #certgate-wireframe .cg-toolbar { align-items: stretch; flex-direction: column; }
  #certgate-wireframe .cg-fields { display: grid; grid-template-columns: 1fr; }
  #certgate-wireframe .cg-input { min-width: 0; width: 100%; }
  #certgate-wireframe .cg-event-item { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 420px) {
  #certgate-wireframe .cg-summary { grid-template-columns: 1fr; }
  #certgate-wireframe .cg-live { display: none; }
  #certgate-wireframe .cg-topbar { gap: 8px; }
}
&lt;/style&gt;
