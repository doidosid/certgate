server {
	listen 80;
	listen [::]:80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Console과 Management API를 same-origin으로 묶는다. 브라우저가 관리 API를
	# 직접 호출하면 cross-origin이 되어 CORS 설정이 필요해지는데, 그 대신 여기서
	# proxy해서 관리 API Port를 Host에 공개하지 않는다(docs/api-spec.md §2
	# "관리자 API는 인터넷 공개 금지").
	location /api/ {
		proxy_pass http://management-api:8080/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# SSE(/api/v1/security-events/stream)를 위한 설정이다. 버퍼링을 켜두면
		# CRITICAL Event가 모였다가 나가서 실시간 Toast가 아니게 되고, 기본 60초
		# read timeout은 서버의 20초 heartbeat 사이에서도 연결을 끊는다.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600s;
	}
}
