server {
	listen 80;
	listen [::]:80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Console과 Management API를 same-origin으로 묶는다. 브라우저가 관리 API를
	# 직접 호출하면 cross-origin이 되어 CORS 설정이 필요해지는데, 그 대신 여기서
	# proxy해서 관리 API Port를 Host에 공개하지 않는다(docs/api-spec.md §2
	# "관리자 API는 인터넷 공개 금지").
	location /api/ {
		proxy_pass http://management-api:8080/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# SSE(/api/v1/security-events/stream)를 위한 설정이다.
		#
		# proxy_buffering off는 필수다. 켜두면 nginx가 응답을 모아서 내보내
		# CRITICAL Event가 즉시 도착하지 않는다 — "실시간 Toast"가 성립하지 않는다.
		#
		# proxy_read_timeout은 연결 수명을 Application이 소유하게 하려는 것이다.
		# CriticalEventBroadcaster는 20초 heartbeat로 연결을 살려두고 5분 뒤
		# Emitter를 스스로 닫아 Browser 재연결을 유도한다(half-open 회수). nginx
		# 기본 60초 read timeout은 20초 heartbeat 덕에 실제로 발동하지는 않지만,
		# 그대로 두면 Application 의도와 별개인 두 번째 수명 한도가 남는다.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600s;
	}
}
