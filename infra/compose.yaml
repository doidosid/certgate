name: ${COMPOSE_PROJECT_NAME:-certgate}

networks:
  certgate-net:
    driver: bridge

volumes:
  postgres-data:
  gateway-outbox:

services:
  postgres:
    image: postgres:16.15-alpine
    networks:
      - certgate-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  management-api:
    build:
      context: ../management-api
      dockerfile: ../infra/docker/management-api/Dockerfile
    networks:
      - certgate-net
    # Loopback에만 묶는다. Compose 안에서는 gateway·admin-console이 서비스명으로
    # 접근하므로 Host 공개는 개발 편의(Vite dev server proxy가 이 Port를 본다)를
    # 위한 것뿐이다. 기본 "8080:8080"은 0.0.0.0에 바인딩되어 같은 네트워크의 다른
    # 기기에서도 관리 API에 닿는데, docs/api-spec.md §2는 관리자 API를 "개발
    # 환경의 localhost·Docker 내부망으로 제한"한다.
    ports:
      - "127.0.0.1:${MANAGEMENT_API_PORT}:8080"
    environment:
      MANAGEMENT_API_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../gateway
      dockerfile: ../infra/docker/gateway/Dockerfile
    networks:
      - certgate-net
    ports:
      - "${GATEWAY_MTLS_PORT}:8443"
    environment:
      GATEWAY_MTLS_PORT: 8443
      GATEWAY_INTERNAL_PORT: 8081
      MANAGEMENT_API_URL: ${MANAGEMENT_API_URL}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      GATEWAY_ACCESS_CACHE_TTL_SECONDS: ${GATEWAY_ACCESS_CACHE_TTL_SECONDS}
      GATEWAY_OUTBOX_PATH: /data/outbox.db
      GATEWAY_EVENT_BATCH_SIZE: ${GATEWAY_EVENT_BATCH_SIZE}
      GATEWAY_EVENT_RETRY_MAX_SECONDS: ${GATEWAY_EVENT_RETRY_MAX_SECONDS}
    volumes:
      - gateway-outbox:/data
    depends_on:
      management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-service:
    build:
      context: ../backend-service
      dockerfile: ../infra/docker/backend-service/Dockerfile
    networks:
      - certgate-net
    environment:
      BACKEND_SERVICE_PORT: 8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/admin-console/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SSE_URL: ${VITE_SSE_URL}
    networks:
      - certgate-net
    # 관리 콘솔도 Loopback에만 묶는다. 콘솔은 /api proxy를 통해 관리 API 전체를
    # 대신 호출할 수 있으므로, 콘솔이 네트워크에 열려 있으면 관리 API를 막은 의미가
    # 없어진다(docs/api-spec.md §2 "인터넷 공개 금지").
    ports:
      - "127.0.0.1:${ADMIN_CONSOLE_PORT}:80"
    depends_on:
      - management-api
